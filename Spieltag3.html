<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beerdarts Championship – Spieltag 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="nav"></div>

<script>
fetch("nav.html")
  .then(r => r.text())
  .then(html => document.getElementById("nav").innerHTML = html);
</script>

<main>
  <h1>Spieltag 3</h1>
    <p>@LowCeiling Village</p>
    <p>xx.0x.2026</p>

    <h3>Vorrunde Best of 3 Legs</h3>
 

<table id="vorrundeSpiele">
  <colgroup>
    <col style="width:44%"> <!-- Spieler 1 -->
    
    <col style="width:5%">  <!-- Legs1 -->
    <col style="width:2%">  <!-- : -->
    <col style="width:5%">  <!-- Legs2 -->
    
    <col style="width:44%"> <!-- Spieler 2 -->
  </colgroup>
  <tr>
    <th>Spieler 1</th><th>Legs</th><th>:</th><th>Legs</th><th>Spieler 2</th>
  </tr>
</table>





<h2>Vorrunde – Tabelle</h2>
<table id="spielerTabelle">
  <tr>
    <th>Platz</th>
    <th>Spieler</th>
    <th>Spiele</th>
    <th>Siege</th>
    <th>Niederlagen</th>
    <th>Legs+</th>
    <th>Legs-</th>
    <th>Punkte</th>
    <th>AVG</th>
  </tr>
</table>



</main>

<script type="module">
import { initDropdown } from './dropdown.js';

fetch("nav.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("nav").innerHTML = html;
    initDropdown(); // erst nach fetch ausführen
  });
</script>



</body>
</html>
