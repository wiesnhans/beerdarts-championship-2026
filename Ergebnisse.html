<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Beerdarts - Ergebnisse eingeben</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }
        
        .selection {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .selection-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .selection-group {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        select, input, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .games-container {
            display: none;
        }
        
        .game-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }
        
        .game-header {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .players-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .player-section {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }
        
        .player-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 12px;
        }
        
        .input-group {
            margin-bottom: 12px;
        }
        
        .input-group label {
            font-size: 0.9em;
            margin-bottom: 4px;
        }
        
        .input-group input {
            width: 100%;
        }
        
        .submit-section {
            margin-top: 30px;
            text-align: center;
        }
        
        .submit-section button {
            max-width: 300px;
            padding: 15px;
            font-size: 1.1em;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }
                
        .loaded-file {
            background: #e7f3ff;
            color: #004085;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
            font-weight: 600;
        }
        
        .loaded-file::before {
            content: "📁 ";
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Beerdarts Championship 2026 - Ergebnisse eingeben</h1>
        
        <div class="message" id="message"></div>
        
        <div class="selection">
            <div class="selection-row">
                <div class="selection-group">
                    <label for="spieltag">Spieltag:</label>
                    <select id="spieltag">
                        <option value="">-- Spieltag wählen --</option>
                        <option value="1">Spieltag 1</option>
                        <option value="2">Spieltag 2</option>
                        <option value="3">Spieltag 3</option>
                        <option value="4">Spieltag 4</option>
                        <option value="5">Spieltag 5</option>
                        <option value="6">Spieltag 6</option>
                        <option value="7">Spieltag 7</option>
                        <option value="8">Spieltag 8</option>
                    </select>
                </div>
                
                <div class="selection-group">
                    <label for="runde">Runde:</label>
                    <select id="runde">
                        <option value="">-- Runde wählen --</option>
                        <option value="vorrunde">Vorrunde</option>
                        <option value="finals">Finalrunde</option>
                    </select>
                </div>
            </div>
            
            <button onclick="loadGames()" id="loadButton">Spiele laden</button>
        </div>
        
        <div class="loading" id="loading" style="display: none;">Lade Spiele...</div>
        
        <div class="games-container" id="gamesContainer">
            <div class="loaded-file" id="loadedFile" style="display: none;"></div>
            <div id="gamesList"></div>
            <div class="submit-section">
                <button onclick="saveResults()">Ergebnisse speichern</button>
            </div>
        </div>
    </div>

    <script>
        let currentData = [];
        let currentFilename = '';

        async function loadGames() {
            const spieltag = document.getElementById('spieltag').value;
            const runde = document.getElementById('runde').value;
            
            if (!spieltag || !runde) {
                showMessage('Bitte wähle einen Spieltag und eine Runde aus.', 'error');
                return;
            }
            
            const filename = runde === 'vorrunde' 
                ? `vorrundespieltag${spieltag}.csv`
                : `finalsspieltag${spieltag}.csv`;
            
            currentFilename = filename;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('gamesContainer').style.display = 'none';
            
            try {
                const response = await fetch(filename);
                if (!response.ok) {
                    throw new Error('Datei nicht gefunden');
                }
                
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        currentData = results.data;
                        
                        // Zeige geladene Datei an
                        const loadedFileEl = document.getElementById('loadedFile');
                        if (loadedFileEl) {
                            loadedFileEl.textContent = `Geladene Datei: ${filename}`;
                            loadedFileEl.style.display = 'block';
                        }
                        
                        displayGames(currentData);
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('gamesContainer').style.display = 'block';
                        
                        showMessage('Spiele erfolgreich geladen!', 'success');
                    },
                    error: function(error) {
                        showMessage('Fehler beim Laden der CSV: ' + error.message, 'error');
                        document.getElementById('loading').style.display = 'none';
                    }
                });
            } catch (error) {
                showMessage('Fehler beim Laden der Datei: ' + error.message, 'error');
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayGames(games) {
            const container = document.getElementById('gamesList');
            container.innerHTML = '';
            
            games.forEach((game, index) => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                gameCard.innerHTML = `
                    <div class="game-header">
                        Spiel ${index + 1}: ${game.spieler1} vs ${game.spieler2} (Best of ${game.modus})
                    </div>
                    
                    <div class="players-row">
                        <div class="player-section">
                            <div class="player-name">${game.spieler1}</div>
                            
                            <div class="input-group">
                                <label>Gewonnene Legs:</label>
                                <input type="number" id="legs_${index}_1" value="${game.legsspieler1 || ''}" min="0">
                            </div>
                            
                            <div class="input-group">
                                <label>Average (3-Dart):</label>
                                <input type="text" id="avg_${index}_1" value="${game.avgspieler1 || ''}" placeholder="z.B. 45.67">
                            </div>
                            
                            <div class="input-group">
                                <label>Anzahl Darts:</label>
                                <input type="number" id="darts_${index}_1" value="${game.dartsspieler1 || ''}" min="0">
                            </div>
                            
                            <div class="input-group">
                                <label>Doppelversuche:</label>
                                <input type="number" id="doppel_${index}_1" value="${game.doppelversuchespieler1 || ''}" min="0">
                            </div>
                            
                            <div class="input-group">
                                <label>Highscore:</label>
                                <input type="number" id="highscore_${index}_1" value="${game.highscorespieler1 || ''}" min="0" max="180">
                            </div>
                            
                            <div class="input-group">
                                <label>Höchstes Checkout:</label>
                                <input type="number" id="highco_${index}_1" value="${game.highcospieler1 || ''}" min="0" max="170">
                            </div>
                        </div>
                        
                        <div class="player-section">
                            <div class="player-name">${game.spieler2}</div>
                            
                            <div class="input-group">
                                <label>Gewonnene Legs:</label>
                                <input type="number" id="legs_${index}_2" value="${game.legsspieler2 || ''}" min="0">
                            </div>
                            
                            <div class="input-group">
                                <label>Average (3-Dart):</label>
                                <input type="text" id="avg_${index}_2" value="${game.avgspieler2 || ''}" placeholder="z.B. 45.67">
                            </div>
                            
                            <div class="input-group">
                                <label>Anzahl Darts:</label>
                                <input type="number" id="darts_${index}_2" value="${game.dartsspieler2 || ''}" min="0">
                            </div>
                            
                            <div class="input-group">
                                <label>Doppelversuche:</label>
                                <input type="number" id="doppel_${index}_2" value="${game.doppelversuchespieler2 || ''}" min="0">
                            </div>
                            
                            <div class="input-group">
                                <label>Highscore:</label>
                                <input type="number" id="highscore_${index}_2" value="${game.highscorespieler2 || ''}" min="0" max="180">
                            </div>
                            
                            <div class="input-group">
                                <label>Höchstes Checkout:</label>
                                <input type="number" id="highco_${index}_2" value="${game.highcospieler2 || ''}" min="0" max="170">
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(gameCard);
            });
        }

        function saveResults() {
            currentData.forEach((game, index) => {
                game.legsspieler1 = parseInt(document.getElementById(`legs_${index}_1`).value) || 0;
                game.legsspieler2 = parseInt(document.getElementById(`legs_${index}_2`).value) || 0;
                
                // Komma in Punkt umwandeln für Average-Werte
                const avg1 = document.getElementById(`avg_${index}_1`).value.replace(',', '.');
                const avg2 = document.getElementById(`avg_${index}_2`).value.replace(',', '.');
                game.avgspieler1 = parseFloat(avg1) || 0;
                game.avgspieler2 = parseFloat(avg2) || 0;
                
                game.dartsspieler1 = parseInt(document.getElementById(`darts_${index}_1`).value) || 0;
                game.dartsspieler2 = parseInt(document.getElementById(`darts_${index}_2`).value) || 0;
                game.doppelversuchespieler1 = parseInt(document.getElementById(`doppel_${index}_1`).value) || 0;
                game.doppelversuchespieler2 = parseInt(document.getElementById(`doppel_${index}_2`).value) || 0;
                game.highscorespieler1 = parseInt(document.getElementById(`highscore_${index}_1`).value) || 0;
                game.highscorespieler2 = parseInt(document.getElementById(`highscore_${index}_2`).value) || 0;
                game.highcospieler1 = parseInt(document.getElementById(`highco_${index}_1`).value) || 0;
                game.highcospieler2 = parseInt(document.getElementById(`highco_${index}_2`).value) || 0;
            });
            
            const csv = Papa.unparse(currentData);
            downloadCSV(csv, currentFilename);
            showMessage('Ergebnisse wurden aktualisiert! Die CSV-Datei wurde heruntergeladen. Bitte ersetze die alte Datei auf dem Server.', 'success');
        }

        function downloadCSV(csv, filename) {
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
